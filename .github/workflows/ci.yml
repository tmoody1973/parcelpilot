name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://parcelpilot:parcelpilot@localhost:5432/parcelpilot
      DATABASE_APP_URL: postgres://parcelpilot_app:parcelpilot-app@localhost:5432/parcelpilot
      DATABASE_SERVICE_URL: postgres://parcelpilot_service:parcelpilot-service@localhost:5432/parcelpilot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres (PostGIS + pgvector) and apply migrations
        run: |
          docker compose up -d --wait db
          pnpm db:migrate
          pnpm rules:seed
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:copy
      - run: pnpm test
      - run: pnpm build

  gold:
    name: gold-cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # All 15 gold cases through the rules engine, the citation gate and the policy: exact match, no database.
      - run: pnpm test:gold

  python:
    name: worker-py tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker-py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr # OCR fallback under test
      - run: uv sync --frozen
      - run: uv run pytest -q
