[project]
name = "parcelpilot-worker-py"
version = "0.0.0"
description = "PDF parsing, table extraction, OCR fallback, and embeddings for ParcelPilot."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
