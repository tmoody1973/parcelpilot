[project]
name = "parcelpilot-worker-py"
version = "0.0.0"
description = "PDF parsing, table extraction, OCR fallback, and embeddings for ParcelPilot."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jsonschema>=4.23",
  "psycopg[binary]>=3.2",
  "boto3>=1.35",
  "pypdf>=5.0",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]
eval = [
    "docling>=2.129.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
