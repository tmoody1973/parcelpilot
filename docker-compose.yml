# Local development stack. Host ports default to values that do not collide with other projects
# (5432, 9100, 8000); override any of them in .env (PP_DB_PORT, PP_S3_PORT, PP_WORKER_PORT).
name: parcelpilot

services:
  db:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: parcelpilot
      POSTGRES_PASSWORD: parcelpilot
      POSTGRES_DB: parcelpilot
    ports:
      - "127.0.0.1:${PP_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U parcelpilot -d parcelpilot"] # TCP: the initdb temp server only listens on the socket, so this cannot pass early
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    # S3-compatible object storage for local runs and CI (page images, source PDFs). Adobe S3Mock, pinned: MinIO's free
    # images stopped being downloadable in September 2026, which broke CI. It accepts any credentials; the bucket below
    # exists from startup, so no init step is needed.
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: parcelpilot-sources
    ports:
      - "127.0.0.1:${PP_S3_PORT:-9100}:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-py:
    build: ./services/worker-py
    ports:
      - "127.0.0.1:${PP_WORKER_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgres://parcelpilot:parcelpilot@db:5432/parcelpilot
      S3_ENDPOINT: http://s3:9090
      S3_BUCKET: parcelpilot-sources
      S3_ACCESS_KEY_ID: parcelpilot
      S3_SECRET_ACCESS_KEY: parcelpilot-local
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
